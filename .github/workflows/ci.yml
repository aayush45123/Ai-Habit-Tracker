name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build (Node 22 LTS)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      TZ: Asia/Kolkata
      JWT_SECRET: ci_test_jwt_secret_key_123456789
      PORT: 5000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ai-habit-tracker/client/package-lock.json
            ai-habit-tracker/server/package-lock.json

      - name: Install Client Dependencies
        run: cd ai-habit-tracker/client && npm ci

      - name: Install Server Dependencies
        run: cd ai-habit-tracker/server && npm ci

      - name: Check Server Syntax (node --check)
        run: npm run lint:server

      - name: Lint Client Source (ESLint)
        run: cd ai-habit-tracker/client && npm run lint
        continue-on-error: true

      - name: Run Full Test Suite (41 Tests)
        run: npm test

      - name: Verify Production Bundle (Vite Build)
        run: cd ai-habit-tracker/client && npm run build

